<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onboarding</title>
    <link rel="shortcut icon" href="./img/favicon.ico" type="image/x-icon">
</head>

<body>

    <div class="c-gsm">
        <div class="c-scherm-a">

            <div class="c-scherm-a__top">
                <h1 class="c-scherm-a__title">Welcome</h1>
            </div>
            <div class="c-scherm-a__bottom">
                <p class="c-scherm-a__text">Every adventure starts with a single step</p>
                <a class="c-scherm-a__btn js-next" id="js-screen-1" href="#">GET STARTED</a>
            </div>
            <div class="js-submit-animation js-submit-animation--1 u-hide c-lottie c-lottie--a"></div>

        </div>
        <div class="c-scherm-a c-scherm-a--b">
            <div class="c-scherm-a__top">
                <h1 class="c-scherm-a__title">Track your journey</h1>
            </div>
            <div class="c-scherm-a__bottom">
                <p class="c-scherm-a__text">Always know what distance you travelled</p>
                <div class="c-scherm-a__btns">
                    <a class="c-scherm-a__btn c-scherm-a__btn--small js-before" href="#">&larr;</a>
                    <div class="c-scherm-a__balls">
                        <span class="c-scherm-a__ball"></span>
                        <span class="c-scherm-a__ball c-scherm-a__ball--active"></span>
                        <span class="c-scherm-a__ball"></span>
                        <span class="c-scherm-a__ball"></span>
                    </div>
                    <a class="c-scherm-a__btn c-scherm-a__btn--small js-next" href="#">&rarr;</a>
                </div>
            </div>
            <div class="js-submit-animation js-submit-animation--2 u-hide c-lottie c-lottie--b"></div>

        </div>
        <div class="c-scherm-a c-scherm-a--c">
            <div class="c-scherm-a__top">
                <h1 class="c-scherm-a__title">Share your Journey</h1>

            </div>
            <div class="c-scherm-a__bottom">
                <p class="c-scherm-a__text">Share your Journey with friends and family</p>
                <div class="c-scherm-a__btns">
                    <a class="c-scherm-a__btn c-scherm-a__btn--small js-before" href="#">&larr;</a>
                    <div class="c-scherm-a__balls">
                        <span class="c-scherm-a__ball"></span>
                        <span class="c-scherm-a__ball"></span>
                        <span class="c-scherm-a__ball  c-scherm-a__ball--active"></span>
                        <span class="c-scherm-a__ball"></span>
                    </div>
                    <a class="c-scherm-a__btn c-scherm-a__btn--small js-next" href="#">&rarr;</a>
                </div>
            </div>
            <div class="js-submit-animation js-submit-animation--3 u-hide c-lottie c-lottie--c"></div>

        </div>
        <div class="c-scherm-a c-scherm-a--d">
            <div class="c-scherm-a__top">
                <h1 class="c-scherm-a__title">Earn badges</h1>
                <div class="js-submit-animation u-hide"></div>

            </div>
            <div class="c-scherm-a__bottom">
                <p class="c-scherm-a__text">Earn badges as you progress</p>
                <div class="c-scherm-a__btns">
                    <a class="c-scherm-a__btn c-scherm-a__btn--small js-before" href="#">&larr;</a>
                    <div class="c-scherm-a__balls">
                        <span class="c-scherm-a__ball"></span>
                        <span class="c-scherm-a__ball"></span>
                        <span class="c-scherm-a__ball "></span>
                        <span class="c-scherm-a__ball c-scherm-a__ball--active"></span>
                    </div>
                    <a class="c-scherm-a__btn c-scherm-a__btn--small js-next" href="#">&rarr;</a>
                </div>
            </div>
            <div class="js-submit-animation js-submit-animation--4 u-hide c-lottie c-lottie--d"></div>

        </div>
        <div class="c-scherm-a c-scherm-a--e">
            <div class="c-scherm-a__top">
                <a class="c-scherm-a__back js-before" href="#">&larr;</a>
                <h1 class="c-scherm-a__title">Welcome</h1>
                <div class="js-submit-animation u-hide"></div>

            </div>
            <div class="c-scherm-a__bottom">
                <p class="c-scherm-a__text">Your journey starts now!</p>
                <a class="c-scherm-a__btn js-next" href="#">Let's go!</a>

            </div>
            <div class="js-submit-animation js-submit-animation--5 u-hide c-lottie c-lottie--e"></div>

        </div>
    </div>
    <script type="module" src="./js/main.js"></script>

</body>

</html>
